<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" width="640" height="440">
  <title>Schéma abstrait : alignement entre besoins métiers et solution</title>
  <defs>
    <pattern id="baDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#D8DDE2"/>
    </pattern>
  </defs>

  <rect width="640" height="440" fill="#FFFFFF"/>
  <rect width="640" height="440" fill="url(#baDots)"/>
  <rect x="0.5" y="0.5" width="639" height="439" fill="none" stroke="#D8DDE2"/>

  <g font-family="Inter, sans-serif" font-size="10" letter-spacing="1.6" fill="#747B82">
    <text x="56" y="60">MÉTIERS</text>
    <text x="496" y="60">SOLUTION</text>
  </g>

  <!-- Colonne besoins -->
  <g>
    <rect x="56" y="80"  width="150" height="52" fill="#FFFFFF" stroke="#D8DDE2"/>
    <rect x="56" y="152" width="150" height="52" fill="#FFFFFF" stroke="#D8DDE2"/>
    <rect x="56" y="224" width="150" height="52" fill="#FFFFFF" stroke="#D8DDE2"/>
    <rect x="56" y="296" width="150" height="52" fill="#FFFFFF" stroke="#D8DDE2"/>
  </g>
  <g fill="#D8DDE2">
    <rect x="72" y="98"  width="92" height="6"/><rect x="72" y="112" width="60" height="6"/>
    <rect x="72" y="170" width="102" height="6"/><rect x="72" y="184" width="48" height="6"/>
    <rect x="72" y="242" width="84" height="6"/><rect x="72" y="256" width="70" height="6"/>
    <rect x="72" y="314" width="96" height="6"/><rect x="72" y="328" width="54" height="6"/>
  </g>

  <!-- Colonne solution -->
  <g>
    <rect x="434" y="104" width="150" height="52" fill="#132F45"/>
    <rect x="434" y="176" width="150" height="52" fill="#2E4B63"/>
    <rect x="434" y="248" width="150" height="52" fill="#2E4B63"/>
    <rect x="434" y="320" width="150" height="52" fill="#132F45"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".38">
    <rect x="450" y="122" width="88" height="6"/><rect x="450" y="136" width="56" height="6"/>
    <rect x="450" y="194" width="72" height="6"/><rect x="450" y="208" width="94" height="6"/>
    <rect x="450" y="266" width="100" height="6"/><rect x="450" y="280" width="46" height="6"/>
    <rect x="450" y="338" width="66" height="6"/><rect x="450" y="352" width="88" height="6"/>
  </g>

  <!-- Colonne centrale : cadrage / traduction -->
  <rect x="288" y="80" width="64" height="292" fill="#F2F4F6" stroke="#C8A96A"/>
  <g fill="#C8A96A">
    <circle cx="320" cy="120" r="4"/>
    <circle cx="320" cy="192" r="4"/>
    <circle cx="320" cy="264" r="4"/>
    <circle cx="320" cy="336" r="4"/>
  </g>
  <path d="M320 124v64M320 196v64M320 268v64" stroke="#C8A96A" stroke-width="1"/>

  <!-- Liaisons -->
  <g fill="none" stroke="#2E4B63" stroke-width="1">
    <path d="M206 106C246 106 268 120 288 120"/>
    <path d="M206 178C246 178 268 192 288 192"/>
    <path d="M206 250C246 250 268 264 288 264"/>
    <path d="M206 322C246 322 268 336 288 336"/>
  </g>
  <g fill="none" stroke="#C8A96A" stroke-width="1.2">
    <path d="M352 120C392 120 400 130 434 130"/>
    <path d="M352 192C392 192 400 202 434 202"/>
    <path d="M352 264C392 264 400 274 434 274"/>
    <path d="M352 336C392 336 400 346 434 346"/>
  </g>

  <!-- Boucle de recette -->
  <path d="M509 372c0 34-96 42-158 42-84 0-220-8-220-46" fill="none"
        stroke="#D8DDE2" stroke-width="1" stroke-dasharray="4 5"/>
  <path d="M131 368l-5 8h10z" fill="#D8DDE2"/>
  <text x="286" y="428" font-family="Inter, sans-serif" font-size="10"
        letter-spacing="1.4" fill="#747B82" text-anchor="middle">RECETTE</text>
</svg>
