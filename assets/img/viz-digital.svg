<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" width="640" height="440">
  <title>Interfaces digitales stylisées sur fond sombre</title>
  <defs>
    <linearGradient id="dgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132F45"/>
      <stop offset="100%" stop-color="#0B2135"/>
    </linearGradient>
    <pattern id="dgDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1" fill="#2E4B63" fill-opacity=".5"/>
    </pattern>
  </defs>

  <rect width="640" height="440" fill="url(#dgBg)"/>
  <rect width="640" height="440" fill="url(#dgDots)"/>

  <!-- Fenetre principale -->
  <g>
    <rect x="56" y="72" width="392" height="264" fill="#0B2135" stroke="#2E4B63"/>
    <path d="M56 104h392" stroke="#2E4B63"/>
    <g fill="#2E4B63">
      <circle cx="74" cy="88" r="3.5"/><circle cx="88" cy="88" r="3.5"/><circle cx="102" cy="88" r="3.5"/>
    </g>
    <rect x="56" y="72" width="392" height="3" fill="#C8A96A"/>

    <!-- Navigation laterale -->
    <path d="M148 104v232" stroke="#2E4B63"/>
    <g fill="#FFFFFF" fill-opacity=".22">
      <rect x="72" y="126" width="56" height="6"/>
      <rect x="72" y="150" width="44" height="6"/>
      <rect x="72" y="174" width="60" height="6"/>
      <rect x="72" y="198" width="38" height="6"/>
    </g>
    <rect x="66" y="122" width="2" height="14" fill="#C8A96A"/>

    <!-- Contenu : tuiles -->
    <g>
      <rect x="170" y="126" width="80" height="52" fill="#132F45" stroke="#2E4B63"/>
      <rect x="262" y="126" width="80" height="52" fill="#132F45" stroke="#2E4B63"/>
      <rect x="354" y="126" width="76" height="52" fill="#132F45" stroke="#2E4B63"/>
      <g fill="#C8A96A">
        <rect x="182" y="140" width="26" height="4"/>
        <rect x="274" y="140" width="20" height="4"/>
        <rect x="366" y="140" width="30" height="4"/>
      </g>
      <g fill="#FFFFFF" fill-opacity=".3">
        <rect x="182" y="156" width="46" height="8"/>
        <rect x="274" y="156" width="38" height="8"/>
        <rect x="366" y="156" width="42" height="8"/>
      </g>
    </g>

    <!-- Graphe -->
    <rect x="170" y="196" width="260" height="120" fill="#132F45" stroke="#2E4B63"/>
    <path d="M186 292l40-30 34 16 40-44 38 22 46-52"
          fill="none" stroke="#C8A96A" stroke-width="1.8"/>
    <g fill="#C8A96A">
      <circle cx="384" cy="204" r="3.2"/>
    </g>
    <g stroke="#2E4B63">
      <path d="M170 240h260M170 276h260"/>
    </g>
  </g>

  <!-- Fenetre mobile -->
  <g>
    <rect x="480" y="128" width="104" height="208" rx="8" fill="#0B2135" stroke="#2E4B63"/>
    <rect x="480" y="128" width="104" height="34" rx="8" fill="#132F45"/>
    <path d="M480 162h104" stroke="#2E4B63"/>
    <g fill="#FFFFFF" fill-opacity=".26">
      <rect x="496" y="142" width="40" height="6"/>
      <rect x="496" y="180" width="72" height="6"/>
      <rect x="496" y="196" width="52" height="6"/>
    </g>
    <rect x="496" y="216" width="72" height="42" fill="#132F45" stroke="#2E4B63"/>
    <g fill="#C8A96A">
      <rect x="506" y="240" width="8" height="10"/>
      <rect x="520" y="232" width="8" height="18"/>
      <rect x="534" y="236" width="8" height="14"/>
      <rect x="548" y="226" width="8" height="24"/>
    </g>
    <rect x="496" y="274" width="72" height="24" fill="#C8A96A"/>
    <rect x="496" y="310" width="52" height="5" fill="#FFFFFF" fill-opacity=".2"/>
  </g>

  <!-- Ligne de principe -->
  <path d="M56 376h528" stroke="#2E4B63"/>
  <text x="56" y="404" font-family="Inter, sans-serif" font-size="11" letter-spacing="2.4" fill="#C8A96A">
    UTILITÉ · SIMPLICITÉ · PERFORMANCE · ÉVOLUTIVITÉ
  </text>
</svg>
