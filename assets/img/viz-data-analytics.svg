<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" width="640" height="440">
  <title>Architecture abstraite : sources, intégration, entrepôt de données et reporting</title>
  <defs>
    <pattern id="daDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#D8DDE2"/>
    </pattern>
  </defs>

  <rect width="640" height="440" fill="#FFFFFF"/>
  <rect width="640" height="440" fill="url(#daDots)"/>
  <rect x="0.5" y="0.5" width="639" height="439" fill="none" stroke="#D8DDE2"/>

  <g font-family="Inter, sans-serif" font-size="10" letter-spacing="1.5" fill="#747B82">
    <text x="48" y="52">SOURCES</text>
    <text x="196" y="52">FLUX</text>
    <text x="316" y="52">ENTREPÔT</text>
    <text x="470" y="52">REPORTING</text>
  </g>

  <!-- Sources -->
  <g fill="#FFFFFF" stroke="#D8DDE2">
    <rect x="48" y="76"  width="104" height="44"/>
    <rect x="48" y="136" width="104" height="44"/>
    <rect x="48" y="196" width="104" height="44"/>
    <rect x="48" y="256" width="104" height="44"/>
  </g>
  <g fill="#2E4B63">
    <rect x="64" y="94"  width="46" height="5"/><rect x="64" y="104" width="28" height="5"/>
    <rect x="64" y="154" width="52" height="5"/><rect x="64" y="164" width="34" height="5"/>
    <rect x="64" y="214" width="40" height="5"/><rect x="64" y="224" width="56" height="5"/>
    <rect x="64" y="274" width="48" height="5"/><rect x="64" y="284" width="30" height="5"/>
  </g>

  <!-- Flux vers l'entrepot -->
  <g fill="none" stroke="#C8A96A" stroke-width="1.2">
    <path d="M152 98C204 98 226 160 268 176"/>
    <path d="M152 158C204 158 228 176 268 190"/>
    <path d="M152 218C204 218 228 206 268 204"/>
    <path d="M152 278C204 278 228 232 268 218"/>
  </g>

  <!-- Controle qualite sur les flux -->
  <g>
    <rect x="196" y="330" width="120" height="40" fill="#F2F4F6" stroke="#C8A96A"/>
    <text x="256" y="355" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.2"
          fill="#2E4B63" text-anchor="middle">DATA QUALITY</text>
    <path d="M256 330V210" stroke="#C8A96A" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="256" cy="210" r="3" fill="#C8A96A"/>
  </g>

  <!-- Entrepot -->
  <g>
    <rect x="268" y="140" width="128" height="120" fill="#132F45"/>
    <g stroke="#2E4B63">
      <path d="M268 172h128M268 204h128M268 232h128"/>
    </g>
    <g fill="#FFFFFF" fill-opacity=".3">
      <rect x="284" y="154" width="44" height="6"/>
      <rect x="284" y="186" width="66" height="6"/>
      <rect x="284" y="216" width="52" height="6"/>
      <rect x="284" y="244" width="72" height="6"/>
    </g>
    <rect x="268" y="140" width="128" height="4" fill="#C8A96A"/>
  </g>

  <!-- Sorties -->
  <g fill="none" stroke="#2E4B63" stroke-width="1">
    <path d="M396 172C440 172 448 132 470 122"/>
    <path d="M396 200h74"/>
    <path d="M396 228C440 228 448 268 470 280"/>
  </g>

  <!-- Tuiles de reporting -->
  <g>
    <rect x="470" y="82" width="122" height="76" fill="#FFFFFF" stroke="#D8DDE2"/>
    <g fill="#C8A96A">
      <rect x="486" y="126" width="14" height="18"/>
      <rect x="506" y="114" width="14" height="30"/>
      <rect x="526" y="120" width="14" height="24"/>
      <rect x="546" y="100" width="14" height="44"/>
      <rect x="566" y="110" width="14" height="34"/>
    </g>
    <rect x="486" y="98" width="40" height="5" fill="#D8DDE2"/>

    <rect x="470" y="172" width="122" height="56" fill="#FFFFFF" stroke="#D8DDE2"/>
    <text x="486" y="206" font-family="Playfair Display, Georgia, serif" font-size="26" fill="#132F45">KPI</text>
    <rect x="546" y="190" width="30" height="5" fill="#C8A96A"/>
    <rect x="546" y="202" width="18" height="5" fill="#D8DDE2"/>

    <rect x="470" y="242" width="122" height="76" fill="#FFFFFF" stroke="#D8DDE2"/>
    <path d="M486 302l22-24 20 14 26-32 22 18" fill="none" stroke="#132F45" stroke-width="1.5"/>
    <circle cx="554" cy="260" r="3" fill="#C8A96A"/>
    <rect x="486" y="258" width="34" height="5" fill="#D8DDE2"/>
  </g>

  <!-- Gouvernance transverse -->
  <path d="M48 396h544" stroke="#D8DDE2"/>
  <text x="48" y="418" font-family="Inter, sans-serif" font-size="10" letter-spacing="1.5" fill="#747B82">
    GOUVERNANCE · DATA STEWARDSHIP · AUTOMATISATION
  </text>
  <rect x="48" y="392" width="72" height="3" fill="#C8A96A"/>
</svg>
